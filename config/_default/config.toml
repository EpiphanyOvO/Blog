# Change baseurl before deploy
# 用 punycode 写法（blog.顿悟.top 的 ASCII 形式）：中文域名直接写会让 Hugo
# 把 host 也百分号编码，canonical / og:url / og:image 会变成
# https://blog.%E9%A1%BF%E6%82%9F.top/... 这种社交平台抓不到的地址。
baseurl = "https://blog.xn--cdus75j.top"
title = "Epiphany0v0"

# Theme i18n support
# Available values: en, fr, id, ja, ko, pt-br, zh-cn, zh-tw, es, de, nl, it, th, el, uk, ar
defaultContentLanguage = "zh-cn"

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage = true

# Change it to your Disqus shortname before using
disqusShortname = ""

[pagination]
pagerSize = 5

# 站点主语言：主题把它写进 <html lang>，中文站不要留 en
[languages]
  [languages.zh-cn]
    locale = "zh-CN"
    weight = 1
