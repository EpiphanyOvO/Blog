name: Deploy to Github Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# --- 关键修改：添加全局环境变量，确保所有 Action 使用 Node.js 24 ---
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Hugo resources
        uses: actions/cache@v4
        env:
          cache-name: cache-hugo-resources
        with:
          path: resources
          key: ${{ env.cache-name }}

      - uses: actions/setup-go@v5
        with:
          go-version: "^1.17.0"
      - run: go version

      - name: Setup Hugo
        # --- 关键修改：升级到 v3 版本，原生支持 Node.js 24 ---
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      # Hugo 0.170 起 extended 版不再自带 libsass，SCSS 必须走 Dart Sass，
      # 否则构建会报 "no Dart Sass binary found in $PATH"
      - name: Setup Dart Sass
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://api.github.com/repos/sass/dart-sass/releases/latest \
            | sed -n 's/.*"tag_name": "\([^"]*\)".*/\1/p' | head -1)
          curl -fsSL -o /tmp/dart-sass.tar.gz \
            "https://github.com/sass/dart-sass/releases/download/${VERSION}/dart-sass-${VERSION}-linux-x64.tar.gz"
          mkdir -p "$HOME/dart-sass"
          tar -xzf /tmp/dart-sass.tar.gz -C "$HOME/dart-sass" --strip-components=1
          echo "$HOME/dart-sass" >> "$GITHUB_PATH"
          "$HOME/dart-sass/sass" --version

      - name: Build
        run: hugo --minify --gc

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true
          single-commit: true
